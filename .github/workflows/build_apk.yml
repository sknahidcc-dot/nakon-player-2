name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Nakon-Player APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses & Ensure SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Restore Keystore & Environment Files
        run: |
          # 1. Restore debug.keystore from base64 if present, or generate fresh debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Successfully restored debug.keystore from base64."
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore."
          fi

          # 2. Ensure .env exists so secrets plugin does not fail
          if [ ! -f ".env" ]; then
            touch .env
            echo "Created empty .env file for secrets plugin."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/my-upload-key.jks" \
            -storepass "nakonplayerpass123" \
            -alias "upload" \
            -keypass "nakonplayerpass123" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 25000 \
            -dname "CN=Nakon Player, OU=Mobile App, O=Nakon, L=Dhaka, ST=Dhaka, C=BD"
          echo "Production Release Keystore generated successfully."

      - name: Build Signed Release & Debug APKs with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: nakonplayerpass123
          KEY_PASSWORD: nakonplayerpass123
        run: |
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Prepare Signed APKs for Download
        run: |
          mkdir -p final_apks
          # Copy Signed Release APK
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk final_apks/Nakon-Player-Release.apk
            echo "Signed Release APK ready:"
            ls -lh final_apks/Nakon-Player-Release.apk
          fi
          # Also copy Debug APK as alternative
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk final_apks/Nakon-Player-Debug.apk
          fi

      - name: Upload APKs to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nakon-Player-APKs
          path: final_apks/*.apk
          retention-days: 30

      - name: Publish Direct APKs to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v21.35.442"
          RELEASE_APK="final_apks/Nakon-Player-Release.apk"
          DEBUG_APK="final_apks/Nakon-Player-Debug.apk"

          gh release create "$TAG_NAME" "$RELEASE_APK" "$DEBUG_APK" \
            --title "Nakon-Player v21.35.442 (Signed Release)" \
            --notes "📱 **Nakon-Player v21.35.442**\n\n### 📦 Download Links:\n- **[Nakon-Player-Release.apk]**: Official Signed Release APK (ইন্সটল করার জন্য রিকমেন্ডেড)\n- **[Nakon-Player-Debug.apk]**: Debug APK (অল্টারনেটিভ)\n\nনিরাপদ ও ফুলস্ক্রিন ফিট-টু-স্ক্রিন, রিনেম, ডিলিট এবং অফলাইন ভিডিও প্লেয়ারের সুবিধাসহ তৈরি।" \
            --latest || gh release upload "$TAG_NAME" "$RELEASE_APK" "$DEBUG_APK" --clobber || echo "Release upload completed or already exists."
